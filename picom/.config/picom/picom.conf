#################################
#             Shadows           #
#################################


#################################
#           Fading              #
#################################

fading=true;
fade-in-step=0.05;
fade-out-step=0.05;
fade-delta=4;

#################################
#   Transparency / Opacity      #
#################################

frame-opacity=0.8;

#################################
#           Corners             #
#################################

rounded-corners=true;
corner-radius=10;

#################################
#            Blur               #
#################################

blur-background=false;
blur-size=5;
blur-strength=3;
blur-method="box";

#################################
#       General Settings        #
#################################

backend = "glx"

# Use higher precision during rendering, and apply dither when presenting the
# rendered screen. Reduces banding artifacts, but may cause performance
# degradation. Only works with OpenGL.
dithered-present = false;
vsync = true;

# Animations 

animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        scale = 0.5;
        duration = 0.1;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        scale = 0.5;
        duration = 0.1;
    },
    {
	triggers = ["size", "position", "geometry"];
	preset = "geometry-change";
	duration = 0.1;
    }
)

# Rule-based per-window options.
#
# See WINDOW RULES section in the man page for how these work.
rules = (
    {
	match = "fullscreen";
	corner-radius=0;
    },
    { 
	match = "QTILE_INTERNAL = 1"; 
	corner-radius=15; 
	blur-background=true; 
    },
    { 
	match = "class_g = 'kitty'";
	opacity=0.85;
	blur-background=true; 
    },
    {
	match = "class_g = 'Gsimplecal'";
	opacity=0.85;
	blur-background=true;
    },
    {
	match = "class_g = 'Nm-connection-editor'";
	opacity=0.9;
	blur-background=true;
    },
    {
	match = "class_g = 'steam'";
	opacity=0.95;
	blur-background=true;
    }
)
